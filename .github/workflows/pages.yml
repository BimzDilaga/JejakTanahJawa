name: Publish Jejak Tanah Jawa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install official web template
        run: python3 .github/scripts/download_web_template.py "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Import game assets
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit

      - name: Test playable chapters
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/boss_trial_smoke.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/day_night_smoke.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/jaka_combat.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/combat_chain_dash.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/chapter_smoke.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/chapter_two_smoke.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/chapter_three_smoke.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/selarong_visual_audit.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/night_encounters.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/progression_boss_phases.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/late_chapters_endings.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/final_boss_combat.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/buto_audio.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/campaign_persistence.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/polish_presentation.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/title_menu.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . res://tests/device_controls.tscn
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/persistence_process.gd -- write
          Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/persistence_process.gd -- read

      - name: Build browser game
        run: |
          mkdir -p web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web web/index.html
          test -s web/index.html
          test -s web/index.pck
          test -s web/index.wasm
          touch web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 20; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (result.data.artifacts.some(item => item.name === 'github-pages' && !item.expired)) {
                core.info('Pages artifact metadata is available.');
                return;
              }
              core.info('Waiting for Pages artifact metadata...');
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            core.setFailed('Pages artifact metadata did not become available.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
